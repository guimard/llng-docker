# LemonLDAP::NG Manager API
# This file is a template: /etc/lemonldap-ng/manager-api-nginx.conf is
# generated from it at each startup when MANAGER_API=yes
server {
  listen __PORT__;
  listen [::]:__PORT__;
  server_name manager-api.__DNSDOMAIN__;
  root /usr/share/lemonldap-ng/manager/api;
  access_log /dev/stdout llng;

  # Uncomment this if you are running behind a reverse proxy and want
  # LemonLDAP::NG to see the real IP address of the end user
  # Adjust the settings to match the IP address of your reverse proxy
  # and the header containing the original IP address
  # As an alternative, you can use the PROXY protocol
  #
  #set_real_ip_from  127.0.0.1;
  #real_ip_header    X-Forwarded-For;

  # Web server protections (MANAGER_API_ALLOW, MANAGER_API_AUTHBASIC)
  #__ACCESS__

  location / {
    rewrite ^/(.*)$ /api.psgi/$1 last;
  }

  location ~ ^/api\.psgi(?:$|/) {
    # Read-only mode (MANAGER_API_READONLY)
    #__READONLY__

    # FastCGI configuration
    include /etc/nginx/fastcgi_params;
    fastcgi_pass unix:__FASTCGISOCKDIR__/llng-fastcgi.sock;
    fastcgi_param LLTYPE psgi;
    # Generated app: protection is set from MANAGER_API_OAUTH2_*
    fastcgi_param SCRIPT_FILENAME /etc/lemonldap-ng/manager-api.psgi;
    fastcgi_split_path_info ^(/api\.psgi)(/.*)$;
    fastcgi_param PATH_INFO $fastcgi_path_info;
    # OAuth2 handler (MANAGER_API_OAUTH2_CLIENTS)
    #__VHOSTTYPE__

    client_max_body_size 10m;
  }
}
