name: Build and Publish experimental Docker Images

# Experimental branch: images are built with the Linagora plugins taken from
# the HEAD of https://github.com/linagora/lemonldap-ng-plugins and published
# with the "exp" tag only (see .github/actions/docker-common).

env:
  VERSION: 2.23.4
  DEBIANRELEASE: trixie
  DOCKERREVISION: 2

on:
  push:
    branches: [exp]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
      - name: build_and_test
        run: ./build-all
        env:
          VERSION: ${{ env.VERSION }}-${{ env.DOCKERREVISION }}

  build-and-push-base:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
      - name: Common setup
        uses: ./.github/actions/docker-common
        with:
          DOCKER_USERNAME: ${{ secrets.DOCKER_USERNAME }}
          DOCKER_PASSWORD: ${{ secrets.DOCKER_PASSWORD }}
          DOCKER_IMAGE: yadd/lemonldap-ng-base
          DIRNAME: ./base
          SHORT_DESCRIPTION: 'Base image for lemonldap-ng dockers'

  build-and-push-portal:
    needs: build-and-push-base
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
      - name: Common setup
        uses: ./.github/actions/docker-common
        with:
          DOCKER_USERNAME: ${{ secrets.DOCKER_USERNAME }}
          DOCKER_PASSWORD: ${{ secrets.DOCKER_PASSWORD }}
          DOCKER_IMAGE: yadd/lemonldap-ng-portal
          DIRNAME: ./portal
          SHORT_DESCRIPTION: 'LemonLDAP::NG Portal'

  build-and-push-portal-hiperf:
    needs: build-and-push-base
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
      - name: Common setup
        uses: ./.github/actions/docker-common
        with:
          DOCKER_USERNAME: ${{ secrets.DOCKER_USERNAME }}
          DOCKER_PASSWORD: ${{ secrets.DOCKER_PASSWORD }}
          DOCKER_IMAGE: yadd/lemonldap-ng-portal
          DIRNAME: ./uwsgi-portal
          IMAGE_SUFFIX2: "-hiperf"
          SHORT_DESCRIPTION: no

  build-and-push-cron:
    needs: build-and-push-base
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
      - name: Common setup
        uses: ./.github/actions/docker-common
        with:
          DOCKER_USERNAME: ${{ secrets.DOCKER_USERNAME }}
          DOCKER_PASSWORD: ${{ secrets.DOCKER_PASSWORD }}
          DOCKER_IMAGE: yadd/lemonldap-ng-cron
          DIRNAME: ./cron
          SHORT_DESCRIPTION: 'LemonLDAP::NG maintenance tasks runner'

  build-and-push-cron-task:
    needs: build-and-push-base
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
      - name: Common setup
        uses: ./.github/actions/docker-common
        with:
          DOCKER_USERNAME: ${{ secrets.DOCKER_USERNAME }}
          DOCKER_PASSWORD: ${{ secrets.DOCKER_PASSWORD }}
          DOCKER_IMAGE: yadd/lemonldap-ng-cron-task
          DIRNAME: ./cron-task
          SHORT_DESCRIPTION: 'LemonLDAP::NG maintenance tasks'

  build-and-push-sessions-backup:
    needs: build-and-push-base
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
