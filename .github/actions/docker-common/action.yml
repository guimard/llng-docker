name: Common docker publish setup
description: common steps for docker-publish jobs
inputs:
  DOCKER_USERNAME:
    required: true
    description: Docker username
  DOCKER_PASSWORD:
    required: true
    description: Docker password
  DOCKER_IMAGE:
    required: true
    description: Image name
  DIRNAME:
    required: true
    description: Working directory
  IMAGE_SUFFIX:
    required: false
    description: Optional image suffix
  IMAGE_SUFFIX2:
    required: false
    description: Optional image suffix
  SHORT_DESCRIPTION:
    required: true
    description: Short description
  VERSION:
    required: false
    description: Version to use, "no" to use env VERSION
  NON_ROOT:
    required: false
    default: no
    description: Publish a non-root

runs:
  using: "composite"
  steps:
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
      - name: Login to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ inputs.DOCKER_USERNAME }}
          password: ${{ inputs.DOCKER_PASSWORD }}
      # Experimental branch: amd64 only, a single "exp" tag per image
      # (no version, no date, never "latest").
      - name: Generate tags
        id: gentags
        shell: bash
        run: |
          echo "tags=${{ inputs.DOCKER_IMAGE }}:exp${{ inputs.IMAGE_SUFFIX }}${{ inputs.IMAGE_SUFFIX2 }}" >> $GITHUB_OUTPUT
          echo "nonroottags=${{ inputs.DOCKER_IMAGE }}:exp-non-root" >> $GITHUB_OUTPUT
      - name: Build and push Docker exp image
        uses: docker/build-push-action@v7
        with:
          context: ${{ inputs.DIRNAME }}
          build-args: |
            BASE=yadd/lemonldap-ng-base:exp${{ inputs.IMAGE_SUFFIX }}
            PORTALBASE=yadd/lemonldap-ng-portal:exp${{ inputs.IMAGE_SUFFIX }}
          platforms: linux/amd64
          push: true
          tags: ${{ steps.gentags.outputs.tags }}
      - name: Build and publish non-root image
        if: inputs.NON_ROOT == 'yes'
        uses: docker/build-push-action@v7
        with:
          context: no-root
          build-args: |
            IMAGE=${{ inputs.DOCKER_IMAGE }}:exp${{ inputs.IMAGE_SUFFIX }}${{ inputs.IMAGE_SUFFIX2 }}
          platforms: linux/amd64
          push: true
          tags: ${{ steps.gentags.outputs.nonroottags }}
