{{- if .Values.manager.enabled }}
kind: Service
apiVersion: v1
metadata:
  name: {{ include "lemonldap.fullname" . }}-manager
spec:
  selector:
    app: lemonldap-manager
  ports:
    - name: manager
      port: 80
      protocol: TCP
    {{- with include "lemonldap.managerApi.port" . }}
    - name: api
      port: {{ . }}
      targetPort: api
      protocol: TCP
    {{- end }}
{{- end }}