{{- if and .Values.ingress.enabled .Values.manager.enabled .Values.config.manager.api.enabled .Values.ingress.managerApi.enabled }}
{{- $port := include "lemonldap.managerApi.port" . }}
{{- /* Dedicated port: /api/ of the manager site, else manager-api.<root> */}}
{{- $host := ternary .Values.config.domain.manager (include "lemonldap.managerApi.host" .) (ne $port "") }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "lemonldap.fullname" . }}-manager-api
  labels:
    {{- include "lemonldap.labels" . | nindent 4 }}
  {{- with merge (dict) (.Values.ingress.managerApi.annotations | default dict) (.Values.ingress.annotations | default dict) }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  {{- if .Values.ingress.ingressClassName }}
  ingressClassName: {{ .Values.ingress.ingressClassName }}
  {{- end }}
  {{- /* On the manager site, TLS is declared by the manager ingress when enabled */}}
  {{- if and .Values.ingress.tls.enabled (not (and $port .Values.ingress.manager.enabled)) }}
  tls:
    - hosts:
        - {{ $host }}
      secretName: {{ printf "%s-tls" $host }}
  {{- end }}
  rules:
    - host: {{ $host | quote }}
      http:
        paths:
          - path: {{ ternary "/api/" "/" (ne $port "") }}
            pathType: Prefix
            backend:
              service:
                name: {{ include "lemonldap.fullname" . }}-manager
                port:
                  {{- if $port }}
                  name: api
                  {{- else }}
                  number: 80
                  {{- end }}
{{- end }}
