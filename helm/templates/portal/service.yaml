kind: Service
apiVersion: v1
metadata:
  name: {{ include "lemonldap.fullname" . }}-portal
  {{- with .Values.portal.service.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  selector:
    app: lemonldap-portal
  ports:
    - name: auth
      port: 80
      protocol: TCP
